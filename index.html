<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Link | GATE</title>
    <link rel="icon" href="link-svgrepo-com.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">

        <aside class="painel">
            <img class="marca" src="logo-bndes-28f92aaa20771b51ec93dbc7484fe2beed0bbdf8cd11ba2f7d83f75572a3a1c5.png" alt="BNDES">
            <h1 class="titulo">Gerador<br>de link</h1>
            <p class="subtitulo">Transforme o caminho de um arquivo no link usado na elaboração do e-mail marketing.</p>
            <a href="tutorial.html" class="tutorialBtn" id="tutorialBtn">Ver tutorial</a>
        </aside>

        <section class="formulario">

            <div class="campo">
                <span class="passo">01</span>
                <label for="fileInput">Selecione o arquivo</label>
                <input type="file" id="fileInput">
            </div>

            <div class="campo">
                <span class="passo">02</span>
                <label for="filePath">Insira apenas o caminho do arquivo</label>
                <input type="text" id="filePath" placeholder="\\servidor\pasta\subpasta" autocomplete="off" spellcheck="false">
            </div>

            <div class="campo">
                <span class="passo">03</span>
                <button class="generateLinkBtn" id="generateLinkBtn">Gerar link</button>
            </div>

            <div class="resultado">
                <span class="rotulo">Link gerado</span>
                <p id="result"></p>

                <div class="copyBtn">
                    <button class="copyLinkBtn" id="copyLinkBtn" style="display:none;">
                        Copiar link
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M21 8C21 6.34315 19.6569 5 18 5H10C8.34315 5 7 6.34315 7 8V20C7 21.6569 8.34315 23 10 23H18C19.6569 23 21 21.6569 21 20V8ZM19 8C19 7.44772 18.5523 7 18 7H10C9.44772 7 9 7.44772 9 8V20C9 20.5523 9.44772 21 10 21H18C18.5523 21 19 20.5523 19 20V8Z" fill="currentColor"></path><path d="M6 3H16C16.5523 3 17 2.55228 17 2C17 1.44772 16.5523 1 16 1H6C4.34315 1 3 2.34315 3 4V18C3 18.5523 3.44772 19 4 19C4.55228 19 5 18.5523 5 18V4C5 3.44772 5.44772 3 6 3Z" fill="currentColor"></path></svg>
                    </button>
                </div>
            </div>

        </section>

    </main>

    <h5 class="rodape">ARMC / DEREL / GATE</h5>

    <script src="gerador_link.js"></script>
</body>
</html>
